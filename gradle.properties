# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ==================== JVM 配置 ====================
# 设置 JVM 内存分配和垃圾回收
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# JDK 17 path (required by AGP 8.8.2)


# ==================== 构建性能优化 ====================
# 开启并行构建
org.gradle.parallel=true
# 开启构建缓存
org.gradle.caching=true
# 开启按需配置
org.gradle.configureondemand=true
# 开启文件系统监视（提升增量构建速度）
org.gradle.vfs.watch=true
# 开启构建扫描（可选）
# org.gradle.scan=true

# ==================== Android 配置 ====================
# AndroidX package structure
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# 开启非传递 R 类（减少 R 类大小，提升编译速度）
android.nonTransitiveRClass=true
# 开启非最终资源 ID（提升构建速度，AGP 8.0+）
android.nonFinalResIds=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
