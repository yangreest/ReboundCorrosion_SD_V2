plugins {
    id 'com.android.application'
}

apply plugin: 'org.greenrobot.greendao'

android {
    namespace 'com.example.gtj_f230_rebound_corrosion'
    compileSdk 35

    defaultConfig {
//        com.example.gtj_f230_rebound_corrosion
//        com.example.gtj_f230_rebound_thickness
        applicationId "com.example.gtj_f230_rebound_thickness"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            keyAlias 'android.keystore'
            keyPassword '123456'
            storeFile file('../android.keystore')
            storePassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES', '/META-INF/LICENSE.md', '/META-INF/LICENSE-notice.md']
        }
    }
}

greendao {
    schemaVersion 1
    daoPackage 'com.example.gtj_f230_rebound_corrosion.functions.database.greenDao.db'
    targetGenDir 'src/main/java'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    // Utils
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'commons-codec:commons-codec:1.18.0'

    // RecyclerView Adapter
    implementation 'io.github.cymchad:BaseRecyclerViewAdapterHelper4:4.1.4'

    // JSON
    implementation 'com.google.code.gson:gson:2.11.0'

    // UI Components
    implementation 'com.contrarywind:Android-PickerView:4.1.9'

    // GreenDao
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'io.github.yuweiguocn:GreenDaoUpgradeHelper:v2.2.1'

    // Image
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Math & DSP
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation('com.github.psambit9791:jdsp:3.1.0') {
        exclude group: 'org.apache.maven.surefire', module: 'common-java5'
    }

    // RxJava
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.5'

    // 本地模块
    implementation project(':utillibrary')
    implementation project(':chird_sdk')
    implementation project(':openCVLibrary340')
    implementation project(':bluetooth_kit')

    // 本地 JAR 依赖
//    implementation files('libs/bluetooth_kit.jar')
    implementation files('libs/printersdkv5.3.jar')
}
