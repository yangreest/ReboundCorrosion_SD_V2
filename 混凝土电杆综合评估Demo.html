<script type="module">const DESIGN_WIDTH=1200,DESIGN_HEIGHT=750;
const stage=document.getElementById('preview-stage');
const screen=document.getElementById('app-screen');
const dialog=document.getElementById('dialog');
function fitNativeWindow(){
  const embedded=Boolean(window.POLE_APP_HOST);
  const gutter=embedded?0:16;
  const width=Math.max(1,window.innerWidth-gutter*2);
  const height=Math.max(1,window.innerHeight-gutter*2);
  const scale=Math.min(embedded?Infinity:1,width/DESIGN_WIDTH,height/DESIGN_HEIGHT);
  document.body.classList.toggle('embedded-app',embedded);
  screen.style.transform=`scale(${scale})`;
  stage.style.width=`${DESIGN_WIDTH*scale}px`;
  stage.style.height=`${DESIGN_HEIGHT*scale}px`;
  dialog.style.setProperty('--native-scale',String(scale));
  dialog.style.maxHeight=`${Math.min(DESIGN_HEIGHT-50,height/scale-24)}px`;
}
function tickNativeClock(){
  const node=document.getElementById('native-clock');
  const parts=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const value=type=>parts.find(p=>p.type===type)?.value||'';
  node.textContent=`${value('year')}-${value('month')}-${value('day')} ${value('hour')}:${value('minute')}:${value('second')}`;
}
window.addEventListener('resize',fitNativeWindow);
window.addEventListener('orientationchange',fitNativeWindow);
fitNativeWindow();
tickNativeClock();
setInterval(tickNativeClock,1000);
</script>
<script type="module">const METRICS = [
  {key:'crack',name:'最大受力裂缝宽度',short:'裂缝',unit:'mm',device:'无线缝宽探头'},
  {key:'strength',name:'混凝土强度',short:'强度',unit:'MPa',device:'回弹检测仪'},
  {key:'corrosion',name:'钢筋锈蚀率',short:'锈蚀',unit:'%',device:'钢筋锈蚀检测仪'},
];
const ROMAN = ['—','I','II','III','IV'];
const LABELS = ['暂无等级','未触发阈值','关注','异常','严重'];
const SCENARIOS = [['complete','完整评估'],['missing','缺项高风险'],['review','异常待复核'],['boundary','临界强度'],['appearance','外观异常']];
const clone = obj => JSON.parse(JSON.stringify(obj));
function decimal(v){const s=String(v).trim();if(!/^\d+(\.\d+)?$/.test(s))return null;const [a,b='']=s.split('.');return {n:BigInt(a+b),d:10n**BigInt(b.length)};}

function roundOptions(){return state.rounds.map(r=>`<option value="${esc(r.id)}" ${r.id===current().id?'selected':''}>${esc(r.id)} · ${esc(r.point.id)} · ${r.point.height} m</option>`).join('');}

function render(){
 const r=current(),e=roundEvaluation(r);state.point=r.point.id;

function workspace(r,e){const p=selected();return `<section class="panel project-panel"><h1 class="section-heading">工程信息<span class="project-status"><button class="section-link" data-action="rounds">测点轮次管理</button><select class="round-select" id="round-select" aria-label="当前测点轮次">${roundOptions()}</select><span>${esc(p.id)} · 三项数据 ${e.n}/3 · ${e.dataReady?'本轮已完成':'采集中'}</span></span></h1><div class="project-grid"><div class="field"><button class="small-link field-label" data-action="project">工程名称：</button><span class="field-value">${esc(projectInfo.name)}</span></div><div class="field"><span class="field-label">构件编号：</span><span class="field-value">${esc(projectInfo.component)}</span></div><div class="field"><span class="field-label">工程地址：</span><span class="field-value">${esc(projectInfo.address)}</span></div><div class="field"><span class="field-label">构件备注：</span><span class="field-value">${esc(projectInfo.remark)}</span></div></div></section><div class="workspace-grid">${METRICS.map(m=>{const v=metricEvaluation(m.key,p,r);return `<section class="panel device-card"><h2 class="section-heading">${m.key==='crack'?'缝宽检测':m.key==='strength'?'回弹检测':'锈蚀检测'}</h2><div class="device-content"><div class="device-status"><span>本轮记录：${p.records[m.key].length} 条</span><button class="small-link saved-points" data-action="stored-points" data-key="${m.key}">本轮记录</button></div><button class="primary device-button" data-action="device" data-key="${m.key}">开始检测</button><div class="device-bottom"><strong>${esc(r.id)} · ${esc(p.id)} · ${m.short}${valueOf(v,m.key)==='—'?'数据未齐':' '+esc(valueOf(v,m.key))+(valueOf(v,m.key)==='未检出'?'':' '+m.unit)}</strong><small>距地 ${p.height} m · 方位 ${p.azimuth}° · 示例记录</small></div></div></section>`;}).join('')}</div><div class="action-bar"><button class="primary" data-action="home">返回</button><button class="primary" data-action="enter">查看综合评估</button></div>`;}
function storedPointsDialog(key){metricDialog(key,false);}
const RECORD_STATES={valid:'有效',pending:'待复核',unlinked:'待关联',invalid:'已排除'};
function allRawRecords(){return state.rounds.flatMap(round=>METRICS.flatMap(metric=>{const evaluation=metricEvaluation(metric.key,round.point,round);return round.point.records[metric.key].map(record=>({round,metric,record,adopted:evaluation.adopted?.id===record.id}));}));}
function matchesSearch(values){const needle=dataFilters.search.trim().toLocaleLowerCase();return !needle||values.join(' ').toLocaleLowerCase().includes(needle);}
function filteredRecords(){return allRawRecords().filter(x=>(dataFilters.round==='all'||x.round.id===dataFilters.round)&&(dataFilters.metric==='all'||x.metric.key===dataFilters.metric)&&(dataFilters.status==='all'||x.record.state===dataFilters.status)&&matchesSearch([x.round.id,x.round.point.id,x.record.id,x.record.sourceRecordId||'',x.record.sourceRound||'',x.metric.name,x.record.value??'未检出']));}
function rawDisplay(key,record){return key==='crack'&&record.checked&&!record.detected?'已检查，未检出':`${record.value??'—'} ${record.unit||(METRICS.find(m=>m.key===key)?.unit||'')}`;}
function componentAvailable(){return !dataArchive.project&&!dataArchive.component;}
function managerHasSelection(){return managerSelection==='project'?!dataArchive.project:managerSelection==='component'&&componentAvailable();}

 return `<div class="catalog-grid"><section class="panel catalog-panel"><h1 class="section-heading">工程列表</h1><div class="catalog-list">${projectRow}</div></section><section class="panel catalog-panel"><h2 class="section-heading">构件列表</h2><div class="catalog-list">${componentRow}</div></section><section class="panel catalog-panel"><h2 class="section-heading">基本信息</h2><div class="catalog-info">${info}</div></section></div><div class="action-bar catalog-actions"><button class="primary" data-action="manager-open" ${componentSelected?'':'disabled'}>打　开</button><button class="primary" data-action="manager-export" ${managerHasSelection()?'':'disabled'}>导　出</button><button class="primary" data-action="manager-delete" ${managerHasSelection()?'':'disabled'}>删　除</button><button class="primary" data-action="manager-recycle">回收站</button><button class="primary" data-action="home">返　回</button></div>`;
}

function methodRecordsTable(){const records=filteredRecords();return `<table class="data-table managed-table method-table"><thead><tr><th>轮次 / 测点</th><th>检测结果</th><th>记录状态</th><th>检测时间</th><th>操作</th></tr></thead><tbody>${records.map(x=>`<tr><td>${esc(x.round.id)} / ${esc(x.round.point.id)}<small>${x.round.point.height} m · ${x.round.point.azimuth}°</small></td><td>${esc(rawDisplay(x.metric.key,x.record))}<small>${esc(x.record.id)}</small>${x.record.inherited?'<small>沿用记录</small>':''}</td><td><span class="status-pill ${x.record.state==='valid'?'':'pending'}">${RECORD_STATES[x.record.state]||esc(x.record.state)}</span>${x.adopted?'<small>本轮采用</small>':''}</td><td>${date(x.record.time)}</td><td><button class="outline" data-action="data-record" data-round="${esc(x.round.id)}" data-key="${x.metric.key}" data-id="${esc(x.record.id)}">查看详情</button></td></tr>`).join('')||'<tr><td colspan="5" class="managed-empty">暂无符合条件的检测记录</td></tr>'}</tbody></table>`;}
function evaluationHistoryTable(){
 if(dataFilters.tab!=='snapshots'){

  return `<table class="data-table managed-table round-history-table"><thead><tr><th>轮次 / 测点</th><th>裂缝 mm</th><th>强度 MPa</th><th>锈蚀 %</th><th>状态 / 等级</th><th>操作</th></tr></thead><tbody>${rounds.map(q=>{const e=roundEvaluation(q);return `<tr><td>${esc(q.id)} / ${esc(q.point.id)}<small>${q.point.height} m · ${q.point.azimuth}°</small></td>${e.point.metrics.map(m=>`<td>${esc(valueOf(m,m.key))}</td>`).join('')}<td>${e.n}/3 项<small>${e.complete?ROMAN[e.formalGrade]+'级':esc(e.state)}</small></td><td><button class="outline" data-action="view-round" data-id="${esc(q.id)}" data-page="assessment">查看评估</button></td></tr>`;}).join('')||'<tr><td colspan="6" class="managed-empty">暂无符合条件的测点轮次</td></tr>'}</tbody></table>`;
 }
 const saved=snapshots.filter(s=>(dataFilters.round==='all'||s.round.id===dataFilters.round)&&matchesSearch([s.id,s.round.id,s.round.point.id]));
 const archived=legacySnapshots.filter(s=>(dataFilters.round==='all'||s.round.id===dataFilters.round||state.rounds.some(r=>r.id===dataFilters.round&&r.legacySourceRound===s.round.id))&&matchesSearch([s.id,s.round.id,...(s.round.points||[]).map(p=>p.id)]));
 return `<table class="data-table managed-table snapshot-history-table"><thead><tr><th>快照编号</th><th>轮次 / 测点</th><th>保存时间</th><th>三项数据</th><th>保存时结论</th><th>操作</th></tr></thead><tbody>${saved.map(s=>`<tr><td>${esc(s.id)}${s.parent?'<small>复算版本</small>':''}</td><td>${esc(s.round.id)} / ${esc(s.round.point.id)}</td><td>${date(s.time)}</td><td>${s.e.n}/3</td><td>${s.e.complete?ROMAN[s.e.formalGrade]+'级':esc(s.e.state)}</td><td><button class="outline" data-action="snapshot" data-id="${esc(s.id)}">查看快照</button></td></tr>`).join('')||'<tr><td colspan="6" class="managed-empty">尚无符合条件的评估快照</td></tr>'}</tbody></table>${archived.length?`<div class="legacy-data"><b>旧版归档</b>${archived.map(s=>`<button class="outline" data-action="legacy-snapshot" data-id="${esc(s.id)}">${esc(s.id)} · 旧轮 ${esc(s.round.id)}</button>`).join('')}</div>`:''}`;
}

function recordAction(mode,key,id){const r=current(),p=selected(),rec=p.records[key].find(x=>x.id===id);if(!rec)return;modalContext={kind:'record-action',mode,key,id};const title=mode==='exclude'?'确认排除记录':mode==='select'?'确认强度选用':'确认记录有效';openModal(title,`<p class="dialog-intro">${esc(p.id)} · ${esc(rec.id)} · 原始值 ${esc(rec.value??'未检出')}。${mode==='exclude'?'排除可能改变当前等级，必须有具体依据；原始记录仍保留。':'请确认位置、检测方法和结果适用性。'}</p><form id="record-action-form">${actorFields(mode==='exclude'?'经现场复测确认该条记录无效':'位置、检测方法与有效性已核对')}<div class="dialog-actions"><button type="button" class="outline" data-action="return-metric" data-key="${key}">返回</button><button class="primary" type="submit">确认并重算</button></div></form>`,'技术复核');}
function simulate(key){const r=current();if(r.status==='closed')return toast('本轮记录已锁定，请先解锁。');const p=selected(),val={crack:'0.08',strength:'52',corrosion:'4'}[key];const needsSelection=key==='strength'&&p.records.strength.some(x=>x.state==='valid');const rec=makeRecord(key,val,p.id,r.id,{id:`${r.id}-${p.id}-${key.toUpperCase()}-${Date.now().toString(36)}`,...(needsSelection?{state:'pending',selected:false,reason:'新增最终强度结果，须技术确认选用方案'}:{})});p.records[key].push(rec);log(`${p.id} ${METRICS.find(m=>m.key===key).short}示例记录入库`,'演示设备','预置示例数据，不代表真实设备回传');render();metricDialog(key,true);toast('示例记录已入库，当前结果已重新计算。');}
function rulesDialog(){const r=current();openModal('项目筛查规则',`<p class="dialog-intro">规则 ${esc(r.ruleVersion)} · q＝实测强度÷预先录入的设计强度×100%。</p><table class="data-table"><thead><tr><th>指标</th><th>I级</th><th>II级</th><th>III级</th><th>IV级</th></tr></thead><tbody><tr><td>锈蚀率 r</td><td>0≤r&lt;5%</td><td>5≤r&lt;15%</td><td>15≤r&lt;30%</td><td>30≤r≤100%</td></tr><tr><td>受力裂缝 w</td><td>有效检查未检出</td><td>0&lt;w≤0.10 mm</td><td>0.10&lt;w≤0.20 mm</td><td>w&gt;0.20 mm</td></tr><tr><td>强度比 q</td><td>q≥100%</td><td>不单独判定</td><td>不单独判定</td><td>q＜100%</td></tr></tbody></table>`,'规则依据');}
function roundsDialog(){const r=current(),p=selected(),e=roundEvaluation(r);openModal('测点轮次管理',`<p class="dialog-intro">一个测点就是一个轮次。每轮关联同一位置的裂缝、强度、锈蚀三项数据，齐全后自动显示“本轮已完成”。新建轮次从 0/3 项开始。</p>${state.rounds.map(q=>{const v=roundEvaluation(q);return `<article class="history-item"><div><b>${esc(q.id)} · ${esc(q.point.id)}</b><small>距地 ${q.point.height} m · 方位 ${q.point.azimuth}°<br>三项数据 ${v.n}/3 · ${v.dataReady?'本轮已完成':'采集中'}${v.pending?' · 评估待复核':''}${q.status==='closed'?' · 记录已锁定':''}${q.id===r.id?' · 当前轮次':''}</small></div><button class="outline" data-action="switch-round" data-id="${esc(q.id)}">${q.id===r.id?'当前':'查看本轮'}</button></article>`;}).join('')}<div class="record-actions"><button class="primary" data-action="new-round">新建测点轮次</button><button class="outline" data-action="toggle-round">${r.status==='open'?'锁定当前记录':'解锁当前记录'}</button></div><h3>当前轮次唯一测点</h3><table class="data-table"><thead><tr><th>轮次</th><th>测点</th><th>距地高度</th><th>方位</th><th>三项数据</th></tr></thead><tbody><tr><td>${esc(r.id)}</td><td>${esc(p.id)}</td><td>${p.height} m</td><td>${p.azimuth}°</td><td>${e.n}/3 · ${e.dataReady?'已完成':'采集中'}</td></tr></tbody></table><p class="small-note">位置固定在本轮，新增测点通过新建轮次登记。锁定记录只控制后续修改，完成状态由三项数据自动判断。</p>`,'一测点一轮次');}
function newRoundDialog(){const nums=state.rounds.map(q=>Number(q.point.id.replace(/^P/,''))).filter(Number.isFinite),next='P'+(Math.max(0,...nums)+1);openModal('新建测点轮次',`<p class="dialog-intro">登记本轮唯一测点的位置。创建后分别采集裂缝、强度、锈蚀；三项数据齐全即完成本轮。</p><form id="new-round-form"><div class="form-grid"><label class="form-field">测点编号<input name="pointId" value="${esc(next)}" required maxlength="12"></label><label class="form-field">距地高度（m）<input name="height" type="number" min="0" max="12" step="0.01" required placeholder="请输入本轮测点高度"></label><label class="form-field">方位（°）<input name="azimuth" type="number" min="0" max="359" step="1" value="0" required></label><label class="form-field">登记人<input name="actor" value="陈工" required maxlength="30"></label></div><p class="small-note">复测同一位置时可使用同一测点编号创建新轮次，采集结果各轮独立保存。</p><div class="dialog-actions"><button class="primary" type="submit">创建空白轮次</button></div></form>`,'一个测点 · 三项参数');}
function historyDialog(){const rows=snapshots.map(s=>`<article class="history-item"><div><b>${esc(s.id)} · ${esc(s.round.id)} / ${esc(s.round.point.id)}</b><small>${date(s.time)} · ${s.e.complete?ROMAN[s.e.formalGrade]+'级':s.e.state} · ${s.e.n}/3 项${s.parent?' · 复算版本':''}</small></div><div class="record-actions"><button class="outline" data-action="snapshot" data-id="${esc(s.id)}">查看本轮快照</button><button class="secondary" data-action="recalculate" data-id="${esc(s.id)}">显式复算</button></div></article>`).join('');const legacy=legacySnapshots.length?`<h3>旧版多点轮次快照 · 只读归档</h3>${legacySnapshots.map(s=>`<article class="history-item"><div><b>${esc(s.id)} · 旧轮 ${esc(s.round.id)}</b><small>${date(s.time)} · 原检测记录与结论保留</small></div><button class="outline" data-action="legacy-snapshot" data-id="${esc(s.id)}">查看旧版归档</button></article>`).join('')}`:'';openModal('历史评估快照',`<p class="dialog-intro">每份新快照只保存一个轮次、一个测点和三项参数。数据、位置、规则及复核状态按保存时留存。</p>${rows||'<div class="empty-state"><strong>尚无单点轮次快照</strong>在当前轮次保存评估后查看。</div>'}${legacy}`,'单点轮次 · 浏览器本地留存');}
function fingerprint(r){const c=clone(r);delete c.updatedAt;return JSON.stringify(c);}
function saveSnapshot(round=current(),parent=null,project=projectInfo){const f=fingerprint(round)+'|'+JSON.stringify(project);if(!parent&&snapshots.some(s=>s.fingerprint===f))return toast('相同数据和规则已保存，无需重复生成版本。');const s={id:`S${String(snapshots.length+1).padStart(3,'0')}`,time:new Date().toISOString(),round:clone(round),project:clone(project),e:clone(roundEvaluation(round)),fingerprint:f,parent};snapshots.unshift(s);persist();render();toast(`已保存${s.e.complete?'本轮':'待完成'}快照 ${s.id}`);return s;}
function snapshotDialog(id){const s=snapshots.find(x=>x.id===id);if(!s)return;const p=s.round.point,v=s.e.points[0];openModal(`快照 ${s.id}`,`${s.project?`<p class="dialog-intro">${esc(s.project.name)} · ${esc(s.project.component)}</p>`:''}<div class="snapshot-banner"><span>${esc(s.round.id)} / ${esc(p.id)} · ${date(s.time)}<br>距地 ${p.height} m · 方位 ${p.azimuth}°<br>设计强度 ${hasStrengthBasis(s.round)?esc(s.round.reference)+' MPa':'待补充'} · ${esc(strengthBasisSummary(s.round,v.metrics[1]))}<br>规则 ${esc(s.round.ruleVersion)} · 保存时结论</span><b>${s.e.complete?ROMAN[s.e.formalGrade]+'级':s.e.state}<br>三项数据 ${s.e.n}/3</b></div>${s.parent?`<div class="notice">由 ${esc(s.parent)} 显式复算生成，原快照保留。</div>`:''}<table class="data-table"><thead><tr><th>本轮参数</th><th>采用结果</th><th>状态 / 等级</th></tr></thead><tbody>${v.metrics.map(m=>`<tr><td>${METRICS.find(x=>x.key===m.key).name}</td><td>${esc(valueOf(m,m.key))} ${['—','未检出'].includes(valueOf(m,m.key))?'':METRICS.find(x=>x.key===m.key).unit}</td><td>${m.grade?ROMAN[m.grade]+'级':m.status}</td></tr>`).join('')}</tbody></table><p class="small-note">本结论对应保存时的 ${esc(s.round.id)} / ${esc(p.id)}，不合并其他测点轮次。历史结论使用保存时的设计强度与规则；显式复算按当前登记基准另存版本，不覆盖本快照。</p><div class="dialog-actions"><button class="outline" data-action="${state.page==='data-detail'?'data-detail':state.page==='data'?'data':'history'}">${state.page==='data-detail'?'返回数据详情':state.page==='data'?'返回数据管理':'返回历史列表'}</button><button class="primary" data-action="recalculate" data-id="${esc(s.id)}">按当前规则复算此测点</button></div>`,'单点轮次快照 · 只读');}
function legacySnapshotDialog(id){const s=legacySnapshots.find(x=>x.id===id);if(!s)return;openModal(`旧版归档 ${s.id}`,`<p class="dialog-intro">这是修改前保存的多点轮次快照，保留原记录和原结论，供历史追溯。</p><div class="snapshot-banner"><span>旧轮 ${esc(s.round.id)} · ${date(s.time)}<br>规则 ${esc(s.round.ruleVersion)} · 保存时结论</span><b>原结论 ${s.e.complete?ROMAN[s.e.formalGrade]+'级':s.e.state}</b></div><table class="data-table"><thead><tr><th>原测点</th><th>裂缝 mm</th><th>强度 MPa</th><th>锈蚀 %</th><th>原等级</th></tr></thead><tbody>${(s.e.points||[]).map(v=>`<tr><td>${esc(v.point.id)} · ${v.point.height} m</td>${v.metrics.map(m=>`<td>${esc(valueOf(m,m.key))}</td>`).join('')}<td>${v.grade?ROMAN[v.grade]+'级':'未完成'}</td></tr>`).join('')}</tbody></table><div class="dialog-actions"><button class="outline" data-action="${state.page==='data-detail'?'data-detail':state.page==='data'?'data':'history'}">${state.page==='data-detail'?'返回数据详情':state.page==='data'?'返回数据管理':'返回历史列表'}</button></div>`,'旧版记录 · 只读归档');}
function recalculate(id){const s=snapshots.find(x=>x.id===id);if(!s)return;const r=clone(s.round);delete r.design;applyProjectBasis(r);r.ruleEnabled=current().ruleEnabled;r.applicability=current().applicability;r.ruleVersion=current().ruleVersion;r.updatedAt=new Date().toISOString();const fresh=saveSnapshot(r,s.id,s.project||projectInfo);if(fresh)snapshotDialog(fresh.id);}
function reuseDialog(key){const r=current(),p=selected(),choices=state.rounds.filter(q=>q.id!==r.id&&q.point.id===p.id&&q.point.height===p.height&&q.point.azimuth===p.azimuth).flatMap(q=>q.point.records[key].filter(x=>x.state==='valid').map(x=>({round:q,record:x})));modalContext={kind:'reuse',key,choices};openModal('确认同点历史沿用',`<p class="dialog-intro">只列出同一测点编号、高度和方位的历史轮次有效记录。采用后保留来源轮次和时间，并标记“沿用”。</p>${choices.length?`<form id="reuse-form"><label class="form-field">选择来源记录<select name="record">${choices.map((c,i)=>`<option value="${i}">${esc(c.round.id)} / ${esc(c.round.point.id)} · ${esc(c.record.id)} · ${esc(c.record.value??'未检出')}</option>`).join('')}</select></label>${actorFields('本轮同点工况未变化，方法及比较口径已核对')}<label class="check-line"><input type="checkbox" name="conditions" required>已确认点位、方法、效期和工况仍适用</label><div class="notice">演示沿用有效期为30天，实际效期由检测方案确定。</div><div class="dialog-actions"><button class="primary" type="submit">确认沿用到本轮</button></div></form>`:'<div class="empty-state"><strong>没有同点位的历史有效记录</strong>本轮可直接采集三项参数。其他位置的结果不列为沿用来源。</div>'}`,'同点跨轮引用 · 技术确认');}
function appearanceDialog(){const r=current();openModal('外观异常',`<p class="dialog-intro">纵向裂纹、露筋或保护层脱落独立展示。即使三项数值均为I级，异常提示也保留。</p>${r.appearances.map(a=>`<article class="record-item"><div class="record-head"><b>${esc(a.pointId)} · ${esc(a.type)}</b><span class="status-pill pending">${a.state==='pending'?'待复核':'已确认'}</span></div><div class="record-meta">${esc(a.note)}<br>${date(a.time)}${a.actor?' · 确认人 '+esc(a.actor):''}</div>${a.photo?`<img class="photo-preview" src="${a.photo}" alt="异常位置照片">`:''}${a.state==='pending'?`<button class="outline" data-action="confirm-appearance" data-id="${esc(a.id)}">技术复核</button>`:''}</article>`).join('')}<form id="appearance-form"><div class="form-grid"><label class="form-field">异常位置<select name="point">${`<option value="${esc(r.point.id)}">${esc(r.point.id)} · ${r.point.height} m</option>`}</select></label><label class="form-field">异常类型<select name="type"><option>钢筋外露</option><option>纵向裂纹</option><option>保护层脱落</option><option>沿筋裂缝</option></select></label><label class="form-field span2">异常说明<textarea name="note" required placeholder="描述位置、范围与现场观察"></textarea></label><label class="form-field">现场照片（可选）<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"></label><label class="form-field">登记人<input name="actor" value="现场人员" required></label></div><div class="dialog-actions"><button class="primary" type="submit" ${r.status==='closed'?'disabled':''}>登记异常并提交复核</button></div></form>`,'独立异常提示');}
function help(){openModal('Demo 操作说明',`<p class="dialog-intro">一个测点就是一个轮次；所有初始记录均为示例。</p><div class="help-step"><span class="n">1</span><div><strong>选择或新建测点轮次</strong><br>每轮位置独立，三项数据从0/3开始采集。</div></div><div class="help-step"><span class="n">2</span><div><strong>采集同一测点三项参数</strong><br>裂缝、强度、锈蚀三项数据齐全后，本轮自动完成。</div></div><div class="help-step"><span class="n">3</span><div><strong>查看并保存本轮结论</strong><br>切换轮次查看各自结果，缺项和复核状态单独提示。</div></div>`,'单点轮次 · 交互演示');}
function navigate(page){if(!componentAvailable()&&['workspace','assessment','data-detail','projects'].includes(page))return toast('构件已移入回收站，请先在数据管理中恢复。');closeModal();state.page=page;render();}
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,r=current();
 if(['simulate','confirm-record','exclude-record','select-strength','reuse','confirm-appearance'].includes(a)&&r.status==='closed')return toast('本轮记录已锁定，请经确认解锁后操作。');
 if(a==='scenario'){state.rounds=[makeRound(b.dataset.id)];state.schemaVersion=2;state.current='R001';chooseDefault();if(b.dataset.id==='review')state.point='P1';closeModal();render();return toast('已切换演示场景，已有快照仍保留。');}
 if(a==='enter'){assessmentReturnPage='workspace';chooseDefault();navigate('assessment');}
 if(a==='back'){if(assessmentReturnPage==='data-detail'){navigate('data-detail');return;}if(isNativeHost()&&typeof window.poleAppBack==='function'){window.poleAppBack();return;}navigate('workspace');}
 if(a==='workspace'||a==='select-project')navigate('workspace');
 if(a==='home')navigate('home');
 if(a==='project')navigate('projects');
 if(a==='data')navigate('data');
 if(a==='data-detail')navigate('data-detail');
 if(a==='settings')navigate('settings');
 if(a==='help')help();
 if(a==='native-return'&&isNativeHost()&&typeof window.poleAppBack==='function')window.poleAppBack();
 if(a==='settings-device'){navigate('workspace');metricDialog(b.dataset.key,true);}
 if(a==='manager-project'){managerSelection='project';render();}
 if(a==='manager-component'){if(componentAvailable()){managerSelection='component';render();}}
 if(a==='manager-open')openManagedComponent();
 if(a==='manager-export')exportManagedDialog();
 if(a==='manager-delete')deleteManagedSelection();
 if(a==='manager-recycle')recycleDialog();
 if(a==='cancel-catalog-delete')closeModal();
 if(a==='confirm-catalog-delete'&&modalContext.kind==='catalog-delete'){const scope=modalContext.scope;if(['project','component'].includes(scope)&&!dataArchive[scope]){dataArchive[scope]={time:new Date().toISOString(),info:clone(projectInfo)};managerSelection=scope==='component'&&!dataArchive.project?'project':'none';log('将'+(scope==='project'?'工程':'构件')+'移入回收站','现场人员','原始检测记录与评估快照保留，可恢复');navigate('data');toast('已移入回收站。');}}
 if(a==='restore-catalog'){const scope=b.dataset.scope;if(['project','component'].includes(scope)&&dataArchive[scope]){dataArchive[scope]=null;managerSelection=componentAvailable()?'component':!dataArchive.project?'project':'none';log('恢复'+(scope==='project'?'工程':'构件'),'现场人员','从回收站恢复，原记录与快照保持关联');closeModal();render();recycleDialog();toast('已恢复。');}}
 if(a==='detail-tab'&&['crack','strength','corrosion','assessment'].includes(b.dataset.tab)){dataDetailTab=b.dataset.tab;dataFilters.metric=dataDetailTab==='assessment'?'all':dataDetailTab;render();}
 if(a==='data-tab'){dataFilters.tab=b.dataset.tab==='snapshots'?'snapshots':'rounds';render();}
 if(a==='reset-data-filter'){dataFilters={...dataFilters,round:'all',metric:'all',status:'all',search:''};render();}
 if(a==='data-record')dataRecordDialog(b.dataset.round,b.dataset.key,b.dataset.id);
 if(a==='data-round'||a==='view-round'){const page=b.dataset.page==='assessment'?'assessment':'workspace';assessmentReturnPage=page==='assessment'&&state.page==='data-detail'?'data-detail':'workspace';if(chooseRound(b.dataset.id))navigate(page);}
 if(a==='point'){const q=state.rounds.find(x=>x.point.id===b.dataset.id);if(q){chooseRound(q.id);render();}}
 if(a==='point-metric'){const q=state.rounds.find(x=>x.point.id===b.dataset.point&&(b.dataset.round?x.id===b.dataset.round:true));if(q){chooseRound(q.id);render();metricDialog(b.dataset.key);}}
 if(a==='metric'||a==='return-metric')metricDialog(b.dataset.key);
 if(a==='device')metricDialog(b.dataset.key,true);
 if(a==='stored-points')storedPointsDialog(b.dataset.key);
 if(a==='simulate')simulate(b.dataset.key);
 if(a==='refresh'){r.updatedAt=new Date().toISOString();render();toast('已重新读取当前轮次并计算，快照不会自动保存。');}
 if(a==='review')reviewDialog();if(a==='rules')rulesDialog();if(a==='rounds')roundsDialog();if(a==='history')historyDialog();
 if(a==='legacy-snapshot')legacySnapshotDialog(b.dataset.id);
 if(a==='save')saveSnapshot();if(a==='snapshot')snapshotDialog(b.dataset.id);if(a==='recalculate')recalculate(b.dataset.id);
 if(a==='confirm-record')recordAction('confirm',b.dataset.key,b.dataset.id);if(a==='exclude-record')recordAction('exclude',b.dataset.key,b.dataset.id);if(a==='select-strength')recordAction('select',b.dataset.key,b.dataset.id);
 if(a==='reuse')reuseDialog(b.dataset.key);if(a==='appearance')appearanceDialog();
 if(a==='switch-round'||a==='switch-round-view'){if(chooseRound(b.dataset.id)){closeModal();render();}}
 if(a==='new-round')newRoundDialog();
 if(a==='toggle-round'){modalContext={kind:'toggle-round'};openModal(r.status==='open'?'锁定本轮记录':'解锁本轮记录',`<p class="dialog-intro">${esc(r.id)}：锁定后暂停修改。本轮完成状态仍由三项数据判断。</p><form id="toggle-round-form">${actorFields(r.status==='open'?'保留当前轮次记录':'需补测或复核本轮记录')}<div class="dialog-actions"><button class="primary" type="submit">确认${r.status==='open'?'锁定':'解锁'}</button></div></form>`,'轮次管理');}
 if(a==='confirm-appearance'){modalContext={kind:'appearance-confirm',id:b.dataset.id};openModal('外观异常技术复核',`<form id="appearance-confirm-form">${actorFields('现场已核实异常，需按既有运维流程处理')}<div class="notice">确认后解除待复核状态，异常提示继续保留，不改变三项数值等级。</div><div class="dialog-actions"><button class="primary" type="submit">确认并保留异常提示</button></div></form>`,'现场核查');}
});
document.addEventListener('change',event=>{if(event.target.id==='round-select'&&chooseRound(event.target.value))render();const filter={'data-round-filter':'round','data-metric-filter':'metric','data-status-filter':'status'}[event.target.id];if(filter){dataFilters[filter]=event.target.value;render();}});
document.addEventListener('toggle',event=>{if(event.target.id==='data-extra-filters')dataFilterAdvanced=event.target.open;},true);
document.addEventListener('input',event=>{if(event.target.id!=='data-search')return;const position=event.target.selectionStart;dataFilters.search=event.target.value;render();const field=$('#data-search');if(field?.focus)field.focus();if(typeof position==='number'&&field?.setSelectionRange)field.setSelectionRange(position,position);});
document.addEventListener('submit',async event=>{
 const form=event.target;if(!(form instanceof HTMLFormElement))return;event.preventDefault();const data=new FormData(form),r=current(),actor=String(data.get('actor')||'').trim(),reason=String(data.get('reason')||'').trim();
 if(form.id==='data-export-form'){exportManagedData(data.get('includeEvaluation')!==null);return;}
 if(!actor)return toast('请填写责任身份。');
 if(form.id==='new-round-form'){
  const pointId=String(data.get('pointId')||'').trim(),heightText=String(data.get('height')??'').trim(),azimuthText=String(data.get('azimuth')??'').trim(),height=Number(heightText),azimuth=Number(azimuthText);
  if(!pointId||!heightText||!azimuthText||!Number.isFinite(height)||height<0||height>12||!Number.isFinite(azimuth)||azimuth<0||azimuth>=360)return toast('请填写测点编号及有效的高度、方位。');
  const existing=state.rounds.find(q=>q.point.id===pointId);
  if(existing&&(existing.point.height!==height||existing.point.azimuth!==azimuth))return toast('该测点编号已对应其他位置，请使用新的编号。');
  const nums=state.rounds.map(q=>Number(q.id.slice(1))).filter(Number.isFinite),id='R'+String(Math.max(0,...nums)+1).padStart(3,'0'),round=blankRound(id,r,{id:pointId,height,azimuth});
  state.rounds.push(round);chooseRound(id);log('新建单点轮次 '+id+' / '+pointId,actor,'本轮仅登记一个位置，三项采集记录为空');closeModal();render();toast('已创建 '+id+' / '+pointId+'，三项数据 0/3。');
 }
 if(form.id==='record-action-form'){if(!reason)return toast('请填写复核依据。');const {key,id,mode}=modalContext,rec=selected().records[key].find(x=>x.id===id);if(!rec)return;if(mode==='exclude'){rec.state='invalid';rec.selected=false;rec.reason=reason;}else if(mode==='select'){selected().records.strength.forEach(x=>{x.selected=x.id===id;if(x.id!==id&&x.state==='valid'){x.state='invalid';x.reason='本轮方案未选用，原始结果仍保留：'+reason;}});}else if(rec.state==='invalid'){rec.state='pending';rec.reason='撤回排除，需重新确认：'+reason;}else{rec.state='valid';rec.reason=reason;if(key==='strength'&&selected().records.strength.filter(x=>x.state==='valid').length>1)selected().records.strength.forEach(x=>x.selected=false);}rec.actor=actor;log(`${selected().id} ${mode==='exclude'?'排除记录':mode==='select'?'选用强度结果':'复核记录'} ${id}`,actor,reason);render();metricDialog(key);toast('复核状态已留痕，当前结果已重算。');}
 if(form.id==='project-form'){
  const values=Object.fromEntries(['name','address','component','remark','designStrength','designReason'].map(key=>[key,String(data.get(key)||'').trim()]));
  if(!values.name||!values.address||!values.component)return toast('请填写工程名称、地址及构件编号。');
  if(values.designStrength&&(ratioUnder('0',values.designStrength)===null||!Number.isFinite(Number(values.designStrength))))return toast('设计强度必须为大于0的有效MPa数值。');
  if(values.designStrength&&!values.designReason)return toast('请填写设计强度的资料来源或确认依据。');
  const before=projectInfo.designStrength||'未录入',changed=values.designStrength!==projectInfo.designStrength||values.designReason!==projectInfo.designReason;
  values.remark=componentRemark(values.remark);projectInfo={...projectInfo,...values,basisSource:values.designStrength?'entered':null,basisVersion:changed?Number(projectInfo.basisVersion||0)+1:projectInfo.basisVersion,designActor:actor,designTime:new Date().toISOString()};
  for(const q of state.rounds)if(q.status==='open')applyProjectBasis(q);
  log('更新工程与构件信息',actor,'设计强度：'+before+' → '+(values.designStrength||'未录入')+' MPa；依据：'+(values.designReason||'待补充'));render();toast('基本信息已保存，q已按有效基准重算，历史快照保留。');
 }
 if(form.id==='toggle-round-form'){if(!reason)return toast('请填写原因。');r.status=r.status==='open'?'closed':'open';if(r.status==='open')applyProjectBasis(r);log(r.status==='open'?'解锁本轮记录':'锁定本轮记录',actor,reason);render();roundsDialog();}
 if(form.id==='reuse-form'){if(!reason||!data.get('conditions'))return toast('请确认效期和工况，并填写沿用原因。');const choice=modalContext.choices[Number(data.get('record'))];if(!choice)return;const source=choice.record;if(Date.now()-new Date(source.time).getTime()>30*86400000)return toast('示例记录已超出演示有效期，禁止沿用。');const key=modalContext.key,p=selected();if(p.records[key].some(x=>x.sourceRecordId===source.id))return toast('该来源记录已被沿用。');const rec=clone(source);rec.id=`REF-${r.id}-${source.id}`;rec.sourceRecordId=source.id;rec.inherited=true;rec.actor=actor;rec.reuseReason=reason;if(key==='strength'){p.records[key].forEach(x=>x.selected=false);rec.selected=true;}p.records[key].push(rec);log(`${p.id}沿用${choice.round.id} ${METRICS.find(m=>m.key===key).short}记录`,actor,reason);render();metricDialog(key);toast('已建立沿用引用，原轮次和来源记录保持不变。');}
 if(form.id==='appearance-form'){const note=String(data.get('note')||'').trim();if(!note)return toast('请描述异常情况。');let photo=null;const file=data.get('photo');if(file instanceof File&&file.size){if(file.size>2*1024*1024)return toast('演示照片请小于2 MB。');if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('请选择PNG、JPEG或WebP图片。');photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});}r.appearances.push({id:'A'+Date.now(),pointId:r.point.id,type:data.get('type'),note,photo,state:'pending',actor,time:new Date().toISOString()});log('登记外观异常',actor,note);render();appearanceDialog();toast('异常已登记，本轮评估待复核，采集完成状态保持独立。');}
 if(form.id==='appearance-confirm-form'){if(!reason)return toast('请填写核查结论。');const a=r.appearances.find(x=>x.id===modalContext.id);if(!a)return;a.state='confirmed';a.actor=actor;a.confirmation=reason;log('确认外观异常 '+a.id,actor,reason);render();appearanceDialog();toast('复核已完成，独立异常提示仍保留。');}
});
$('#close-dialog').addEventListener('click',closeModal);$('#help-button').addEventListener('click',help);$('#dialog').addEventListener('click',event=>{if(event.target===$('#dialog')){const rect=$('#dialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
render();
</script>
